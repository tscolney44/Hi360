name: Hi360 Android Preview Release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Gradle
        run: |
          curl -L https://services.gradle.org/distributions/gradle-8.9-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-8.9/bin" >> $GITHUB_PATH
      - name: Build preview APK
        working-directory: android
        run: gradle :app:assembleDebug --no-daemon
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Hi360 ${{ github.ref_name }} (Preview)
          generate_release_notes: true
          files: android/app/build/outputs/apk/debug/app-debug.apk
