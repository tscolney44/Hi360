name: Hi360 Android Preview Release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Android SDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "$SDK_ROOT/cmdline-tools/16.0/bin" >> $GITHUB_PATH
          export PATH="$SDK_ROOT/cmdline-tools/16.0/bin:$PATH"
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - name: Install Gradle
        run: |
          curl -L https://services.gradle.org/distributions/gradle-8.9-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-8.9/bin" >> $GITHUB_PATH
      - name: Build preview APK
        working-directory: android
        run: gradle :app:assembleDebug --no-daemon
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Hi360 ${{ github.ref_name }} (Preview)
          generate_release_notes: true
          files: android/app/build/outputs/apk/debug/app-debug.apk
